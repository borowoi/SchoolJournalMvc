name: .NET CI

# Запуск при любом изменении в репозитории (push в любую ветку, pull request)
on:
  push:
  pull_request:

jobs:
  build:
    # Компиляция под две разные платформы
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SchoolJournal.sln

      - name: Build
        run: dotnet build SchoolJournal.sln --no-restore --configuration Release
